<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Four Strategic Pillars - Infographic</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Segoe UI', sans-serif;
      background: #f5f5f5;
    }
    #container {
      width: 100%;
      height: 800px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .controls {
      margin-bottom: 20px;
      text-align: center;
    }
    button {
      padding: 10px 20px;
      font-size: 14px;
      background: #2E5C8A;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin: 0 10px;
    }
    button:hover {
      background: #1E3A5F;
    }
  </style>
</head>
<body>
  <div class="controls">
    <button id="exportSvg">Export SVG</button>
    <button id="exportPng">Export PNG</button>
  </div>
  <div id="container"></div>
  <script src="https://unpkg.com/@antv/infographic@latest/dist/infographic.min.js"></script>
  <script>
    const infographic = new AntVInfographic.Infographic({
      container: '#container',
      width: '100%',
      height: '100%',
    });

    const syntax = `infographic compare-quadrant-quarter-simple-card
data
  title Four Strategic Pillars
  desc Key principles for digital transformation success
  compares
    - label Experience
      icon users group
      desc People-Centric Design
      children
        - label Principle
          Design solutions that prioritize user needs
        - label Why
          User-centric design drives adoption
    - label Intelligence
      icon brain psychology
      desc Smart Automation
      children
        - label Principle
          Leverage AI to enhance decision-making
        - label Why
          Smart systems improve accuracy and speed
    - label Trust
      icon shield verified
      desc Secure & Reliable
      children
        - label Principle
          Build secure, compliant systems
        - label Why
          Trust is the foundation of transformation
    - label Efficiency
      icon settings tune
      desc Optimized Performance
      children
        - label Principle
          Optimize processes to maximize output
        - label Why
          Efficient operations reduce costs
theme
  palette #2E5C8A #3B9FD9 #1AB8C9 #2DB87A
  base.text.font-family Segoe UI`;

    infographic.render(syntax);
    document.fonts?.ready.then(() => {
      infographic.render(syntax);
    }).catch((error) => console.error('Error waiting for fonts to load:', error));

    // Export SVG
    document.getElementById('exportSvg').addEventListener('click', async () => {
      const svgDataUrl = await infographic.toDataURL({ type: 'svg' });
      const link = document.createElement('a');
      link.download = 'Four-Strategic-Pillars.svg';
      link.href = svgDataUrl;
      link.click();
    });

    // Export PNG
    document.getElementById('exportPng').addEventListener('click', async () => {
      const pngDataUrl = await infographic.toDataURL({ type: 'png', pixelRatio: 2 });
      const link = document.createElement('a');
      link.download = 'Four-Strategic-Pillars.png';
      link.href = pngDataUrl;
      link.click();
    });
  </script>
</body>
</html>
